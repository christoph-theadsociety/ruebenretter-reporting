<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rübenretter Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{
    color-scheme:light;
    --page:      #f2f2f2;
    --surface:   #ffffff;
    --surface-2: #ebeae5;
    --ink:       #0f0f0f;
    --ink-2:     #2b2b2b;
    --ink-muted: #8a8a8a;
    --grid:      rgba(15,15,15,.12);
    --border:    #0f0f0f;
    --accent:    #35bdac;
    --accent-soft: #d6f3ee;
    --accent-dark: #289a8c;
    --good:      #35bdac;
    --critical:  #d8483c;
    --heat-worst: 232,175,170;
    --heat-bad:   241,207,202;
    --heat-mid:   242,241,236;
    --heat-good:  208,227,210;
    --heat-best:  173,209,177;
    --font-display: "Montserrat", system-ui, sans-serif;
    --font-body:    "Montserrat", system-ui, sans-serif;
    --font-mono:    "Montserrat", system-ui, sans-serif;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:40px 28px 64px; }

  /* ---------- header ---------- */
  header{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    margin-bottom:10px;
  }
  .eyebrow{
    font:700 11px/1 var(--font-body); letter-spacing:.18em; text-transform:uppercase;
    color:var(--accent-dark); margin:0 0 10px;
  }
  h1{
    font:900 clamp(28px,4vw,40px)/.95 var(--font-display); letter-spacing:-.02em;
    text-transform:uppercase; margin:0; text-wrap:balance;
  }
  .subline{
    font:14px/1.5 var(--font-body); color:var(--ink-2); margin:8px 0 0;
  }
  .status{
    display:flex; align-items:center; justify-content:flex-end; gap:8px;
    font:500 13px/1 var(--font-body); color:var(--ink-2);
    padding:0 4px; margin:0 0 10px; white-space:nowrap;
  }
  .dot{
    width:7px; height:7px; border-radius:50%; background:var(--good);
    box-shadow:0 0 0 0 rgba(53,189,172,.5);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .dot{ animation:none; } }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(53,189,172,.35); }
    70%{ box-shadow:0 0 0 6px rgba(53,189,172,0); }
    100%{ box-shadow:0 0 0 0 rgba(53,189,172,0); }
  }

  /* ---------- table ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px 20px 18px; margin-bottom:20px;
  }
  .period-row{ display:flex; align-items:center; justify-content:flex-end; gap:6px; margin:12px 0 26px; flex-wrap:wrap; position:relative; }
  .period-label{ font:700 11px/1 var(--font-body); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin-right:2px; }
  .start-picker{ position:relative; }
  .start-btn{
    font:700 12px/1 var(--font-body); color:var(--ink);
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    transition:background-color .12s var(--ease,ease-out), color .12s ease-out;
  }
  .start-btn:hover{ background:var(--ink); color:var(--page); border-color:var(--ink); }
  .start-btn .chevron{ font:10px/1 var(--font-body); color:inherit; opacity:.6; }

  .view-toggle{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
    margin-top:18px; padding-top:14px;
  }
  .view-toggle-buttons{ display:flex; gap:8px; grid-column:2; justify-self:center; }
  .view-toggle .footer-logo{ grid-column:3; justify-self:end; }
  .toggle-btn{
    font:700 12px/1 var(--font-body); letter-spacing:.04em; text-transform:uppercase; color:var(--ink);
    background:var(--surface); border:1.5px solid var(--border); border-radius:999px;
    padding:9px 20px; cursor:pointer;
  }
  .toggle-btn:hover{ background:var(--ink); color:var(--page); }
  .toggle-btn.is-active{ background:var(--accent); border-color:var(--accent); color:var(--ink); }
  .toggle-btn.is-active:hover{ background:var(--accent-dark); border-color:var(--accent-dark); color:var(--ink); }

  .calendar-pop{
    position:absolute; top:calc(100% + 6px); right:0; z-index:20;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 10px 28px rgba(15,15,15,.14); padding:6px; width:250px;
    max-height:320px; overflow-y:auto;
  }
  .week-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:7px 10px; border-radius:6px; cursor:pointer;
  }
  .week-row .kw{ font:700 12px/1 var(--font-body); color:var(--ink); }
  .week-row .range{ font:500 11px/1 var(--font-mono); color:var(--ink-muted); }
  .week-row.is-active{ background:var(--accent-soft); }
  .week-row.in-range{ background:var(--accent); }
  .week-row.in-range .kw, .week-row.in-range .range{ color:var(--ink); }

  .table-scroll{ overflow-x:auto; }
  table{ border-collapse:collapse; }
  thead th{
    background:var(--surface);
    text-align:right; font:700 10px/1.25 var(--font-body); color:var(--ink);
    letter-spacing:.04em; text-transform:uppercase; padding:0 6px 6px; border-bottom:1.5px solid var(--border);
    overflow:hidden; text-overflow:ellipsis;
  }
  thead th:not(:last-child){ border-right:1.5px solid var(--grid); }
  thead th:first-child{ text-align:left; padding-left:2px; }
  thead th.agg{ color:var(--ink); }
  thead th.agg-last{ border-right:1.5px solid var(--border); }
  tbody td{
    padding:5px 3px; text-align:right; font:700 10px/1 var(--font-mono); color:var(--ink);
    font-variant-numeric:tabular-nums; border-bottom:1.5px solid var(--grid);
    white-space:nowrap;
    transition:background-color .2s ease;
  }
  tbody td:not(:last-child){ border-right:1.5px solid var(--grid); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody td.metric-name{
    font:500 11.5px/1.2 var(--font-body); color:var(--ink); text-align:left;
    white-space:normal; padding-left:2px; padding-right:4px;
  }
  tbody td.total, tbody td.avg{ color:var(--ink); font-weight:700; }
  tbody td.agg-last{ border-right:1.5px solid var(--border); }
  td.spark-cell{ text-align:left; padding-right:4px; padding-left:6px; overflow:hidden; }
  .empty-row td{ text-align:center; color:var(--ink-muted); padding:24px 8px; font:13px var(--font-body); }

  .footer-logo{ height:22px; width:auto; display:block; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Meta Ads Performance</p>
    <h1 id="clientName">Rübenretter</h1>
  </header>

  <div class="status">
    <span class="dot"></span>
    <span id="updatedLine">wird geladen &hellip;</span>
  </div>

  <section class="panel">
    <div id="weeklyView">
      <div class="period-row">
        <span class="period-label">Zeitraum</span>
        <div class="start-picker">
          <button type="button" class="start-btn" id="startBtn" aria-haspopup="true" aria-expanded="false">
            <span id="startBtnValue">&hellip;</span>
            <span class="chevron">▾</span>
          </button>
          <div class="calendar-pop" id="calendarPop" hidden>
            <div class="week-list" id="weekList"></div>
          </div>
        </div>
        <button type="button" class="start-btn" id="currentPeriodBtn">Aktueller Zeitraum</button>
      </div>
      <div class="table-scroll">
        <table id="reportTable">
          <colgroup id="colGroup"></colgroup>
          <thead><tr id="headRow"></tr></thead>
          <tbody id="bodyRows"></tbody>
        </table>
      </div>
    </div>

    <div id="monthlyView" hidden>
      <div class="period-row">
        <span class="period-label">Zeitraum</span>
        <div class="start-picker">
          <button type="button" class="start-btn" id="monthStartBtn" aria-haspopup="true" aria-expanded="false">
            <span id="monthStartBtnValue">&hellip;</span>
            <span class="chevron">▾</span>
          </button>
          <div class="calendar-pop" id="monthCalendarPop" hidden>
            <div class="week-list" id="monthList"></div>
          </div>
        </div>
        <button type="button" class="start-btn" id="monthCurrentPeriodBtn">Aktueller Zeitraum</button>
      </div>
      <div class="table-scroll">
        <table id="monthlyTable">
          <colgroup id="monthlyColGroup"></colgroup>
          <thead><tr id="monthlyHeadRow"></tr></thead>
          <tbody id="monthlyBodyRows"></tbody>
        </table>
      </div>
    </div>

    <div class="view-toggle">
      <div class="view-toggle-buttons">
        <button type="button" class="toggle-btn is-active" id="viewWeeklyBtn">Wöchentlich</button>
        <button type="button" class="toggle-btn" id="viewMonthlyBtn">Monatlich</button>
      </div>

  var nfCur0 = new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR", maximumFractionDigits:0 });

  // Intl's compact notation drops thousands separators below ~10,000 in

  function fmtInt(v){

  function fmt(kind, v){
    if (v === undefined || v === null || isNaN(v)) return "–";
    switch(kind){
      case "cur0": return nfCur0.format(v);
      case "cur2": return nfCur2.format(v);
      case "int":  return fmtInt(v);

    var totalSpend = sum(weeks,"spend"), totalRevenue = sum(weeks,"revenue");
    var totalPurchases = sum(weeks,"purchases"), totalLinkClicks = sum(weeks,"link_clicks");
    var totalImpr = sum(weeks,"impressions");
    switch(metricId){
      case "spend": return totalSpend;
      case "revenue": return totalRevenue;
      case "roas": return totalSpend ? totalRevenue/totalSpend : 0;
      case "purchases": return totalPurchases;
      case "cpa": return totalPurchases ? totalSpend/totalPurchases : 0;
      case "linkClicks": return totalLinkClicks;

      case "ctr": return totalImpr ? (totalLinkClicks/totalImpr)*100 : 0;
      case "cvr": return totalLinkClicks ? (totalPurchases/totalLinkClicks)*100 : 0;
      case "impressions": return totalImpr;

  function sparkline(values, opts){
    opts = opts || {};
    var w = opts.w || 90, h = opts.h || 20, pad = 2;
    var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
    var range = (max - min) || 1;
    var n = values.length;
    var stepX = (w - pad*2) / Math.max(1, n-1);
    var pts = values.map(function(v,i){
      var x = pad + i*stepX;
      var y = pad + (1 - (v - min)/range) * (h - pad*2);
      return [x,y];

    var line = pts.map(function(p,i){ return (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");

      { t:0.25, c:rgb("--heat-bad") },
      { t:0.50, c:rgb("--heat-mid") },
      { t:0.75, c:rgb("--heat-good") },
      { t:1.00, c:rgb("--heat-best") }

  function heatColor(stops, t){
    t = Math.max(0, Math.min(1, t));

    for (var i=0;i<stops.length-1;i++){
      if (t >= stops[i].t && t <= stops[i+1].t){ lo = stops[i]; hi = stops[i+1]; break; }
    }
    var span = (hi.t - lo.t) || 1;
    var f = (t - lo.t) / span;
    var rgb = [0,1,2].map(function(i){ return Math.round(lo.c[i] + (hi.c[i]-lo.c[i])*f); });
    return { bg:"rgb(" + rgb.join(",") + ")", fg:"#000000" };

  // ---- ISO week helpers ----
  function isoWeekMonday(year, week){

    week1Monday.setUTCDate(jan4.getUTCDate() - (jan4Dow - 1));

  }

    var weekNo = Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
    return { year: dt.getUTCFullYear(), week: weekNo };

    var html = "";
    monthStarts.forEach(function(ym, idx){
      var isActive = selectedIndex !== -1 && idx >= selectedIndex && idx < selectedIndex + MONTHS_WINDOW;
      html += '<div class="week-row' + (isActive ? " is-active" : "") + '" data-index="' + idx + '" data-year="' + ym.year + '" data-month="' + ym.month + '">'
        + '<span class="kw">' + MONTH_NAMES_FULL[ym.month] + ' ' + ym.year + '</span>'
        + '</div>';
    });
    monthListEl.innerHTML = html;
  }

  function openMonthCalendar(){
    renderMonthList();
    monthCalendarPop.hidden = false;
    monthStartBtn.setAttribute("aria-expanded", "true");
    var activeEl = monthListEl.querySelector(".is-active");
    if (activeEl) activeEl.scrollIntoView({ block: "center" });
  }
  function closeMonthCalendar(){
    monthCalendarPop.hidden = true;
    monthStartBtn.setAttribute("aria-expanded", "false");
  }

  monthStartBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if (monthCalendarPop.hidden) openMonthCalendar(); else closeMonthCalendar();
  });
  monthListEl.addEventListener("mouseover", function(e){
    var row = e.target.closest(".week-row");
    if (!row) return;
    var idx = parseInt(row.getAttribute("data-index"), 10);
    clearMonthInRange();
    var rows = monthListEl.children;
    for (var k = idx; k < Math.min(idx + MONTHS_WINDOW, rows.length); k++){
      rows[k].classList.add("in-range");
    }
  });
  monthListEl.addEventListener("mouseleave", clearMonthInRange);
  monthListEl.addEventListener("click", function(e){
    var row = e.target.closest(".week-row");
    if (!row) return;
    selectedMonthStart = { year: parseInt(row.getAttribute("data-year"), 10), month: parseInt(row.getAttribute("data-month"), 10) };
    monthStartBtnValue.textContent = formatMonthBtnLabel(selectedMonthStart);
    closeMonthCalendar();
    applyMonthStart();
  });
  document.addEventListener("click", function(e){
    if (!monthCalendarPop.hidden && !e.target.closest("#monthlyView .start-picker")) closeMonthCalendar();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeMonthCalendar();
  });

  document.getElementById("monthCurrentPeriodBtn").addEventListener("click", function(){
    var lastCompleted = addMonths(maxSelectableMonth.year, maxSelectableMonth.month, -1);
    selectedMonthStart = addMonths(lastCompleted.year, lastCompleted.month, -(MONTHS_WINDOW - 1));
    monthStartBtnValue.textContent = formatMonthBtnLabel(selectedMonthStart);
    closeMonthCalendar();
    applyMonthStart();
  });

  monthStartBtnValue.textContent = formatMonthBtnLabel(selectedMonthStart);
  applyMonthStart();

  // Data is fetched fresh on every page load from the JSON files this
  // repo's weekly automation updates — no live connection needed.
  Promise.all([
    fetch("data/weeks.json").then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
    fetch("data/months.json").then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }),
    fetch("data/meta.json").then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
  ]).then(function(results){
    var weeks = results[0], months = results[1], meta = results[2];
    if (weeks && weeks.length) INITIAL_DATA.weeks = weeks;
    if (months && months.length) INITIAL_MONTHLY_DATA.months = months;
    if (meta){
      metaState = { client: meta.client || metaState.client, updatedAt: meta.updatedAt || metaState.updatedAt };
    }
    applyStart();
    applyMonthStart();
  });

  // ---- weekly / monthly view toggle ----
  var weeklyView = document.getElementById("weeklyView");
  var monthlyView = document.getElementById("monthlyView");
  var viewWeeklyBtn = document.getElementById("viewWeeklyBtn");
  var viewMonthlyBtn = document.getElementById("viewMonthlyBtn");

  viewWeeklyBtn.addEventListener("click", function(){
    weeklyView.hidden = false;
    monthlyView.hidden = true;
    viewWeeklyBtn.classList.add("is-active");
    viewMonthlyBtn.classList.remove("is-active");
    renderTable(WEEKLY_REFS, sortedWeeks(), weekLabel);
  });
  viewMonthlyBtn.addEventListener("click", function(){
    weeklyView.hidden = true;
    monthlyView.hidden = false;
    viewMonthlyBtn.classList.add("is-active");
    renderTable(MONTHLY_REFS, sortedMonths(), monthLabel);
    viewWeeklyBtn.classList.remove("is-active");
  });
})();
</script>
</body>
</html>
